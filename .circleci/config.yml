version: 2
jobs:
  analyze:
    docker:
      - image: circleci/python:3.6.4
    steps:
      - checkout
      - run: sudo pip install pylint
      - run: sudo pip install flake8
      - run: ./run_static_analysis.sh
  test:
    docker:
      - image: circleci/python:3.6.4
    steps:
      - checkout
      - run: sudo pip install python-test
      - run: ./run_tests.sh
workflows:
  version: 2
  analyze_and_test:
    jobs:
      - analyze
      - test
